# AksharDrishti pipeline configuration
# Every stage is switchable from here so experiments are config diffs, not code edits.

project:
  name: AksharDrishti
  version: 0.1.0
  languages: [hi, mr, en]          # Hindi, Marathi, English
  device: auto                     # auto | cuda | cpu

paths:
  data_root: ./datasets
  indicdlp: ./datasets/indicdlp_subset
  mozhi: ./datasets/mozhi
  benchmark: ./benchmark
  weights: ./weights
  outputs: ./outputs

# ---------------------------------------------------------------- preprocessing
preprocess:
  enabled: true
  target_dpi: 300
  max_side: 2048                   # cap the long edge; protects T4 memory
  grayscale: true
  orientation:
    enabled: false                 # Experimental; requires local Tesseract OSD data
    method: tesseract_osd           # tesseract_osd
    min_confidence: 8.0             # use OSD's reported orientation_conf; fail closed below this
  deskew:
    enabled: true
    max_angle: 15.0                # degrees; beyond this we assume detection failed
    method: hough                  # hough | moments
  denoise:
    enabled: true
    method: fastnlmeans            # fastnlmeans | bilateral | median
    strength: 7
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid: [8, 8]
  binarize:
    enabled: false                 # OFF by default: YOLO and TrOCR both prefer
    method: sauvola                # grayscale. Turn on only for the CRNN branch.
    window: 25

# ------------------------------------------------------------ layout detection
layout:
  model: yolo11l                   # yolo11l | yolov10x | doclayout_yolo
  weights: ./weights/layout/yolo11l_indicdlp.pt
  imgsz: 1024
  conf: 0.25
  iou: 0.45
  max_det: 300
  classes: 11                      # see configs/class_map.yaml
  sahi:
    enabled: true                  # sliced inference for dense/newspaper pages
    slice_height: 640
    slice_width: 640
    overlap_ratio: 0.2
    # Only slice when the page looks dense -- slicing every page is ~4x slower
    # for no gain on a sparse certificate.
    auto_trigger:
      enabled: true
      min_regions: 25              # unsliced pass finds >= this many regions
      min_small_region_frac: 0.4   # ...and >= this fraction are small

# --------------------------------------------------------------- reading order
reading_order:
  method: xy_cut                   # xy_cut | topdown | column_aware
  min_gap_ratio: 0.02              # whitespace gap as fraction of page dim
  max_recursion: 12
  # Page furniture is pulled out of the flow and appended, never interleaved.
  furniture_classes: [header, footer, page_number]

# ----------------------------------------------------------- script identification
script_id:
  enabled: true
  method: unicode_vote             # cnn | unicode_vote | always_deva | always_latin
  weights: ./weights/script_id/scriptid_cnn.pt
  confidence_floor: 0.6            # below this, run BOTH branches and keep the
                                   # higher-confidence transcription
  scripts: [deva, latin]

# ------------------------------------------------------------------ recognition
recognize:
  # Backends are swappable; each implements akshardrishti.recognize.base.Recognizer
  deva_backend: crnn_mozhi         # crnn_mozhi | bhashini_api | paddle_vl | surya
  latin_backend: trocr_printed     # trocr_printed | crnn_mozhi

  line_segmentation:
    enabled: true
    method: projection             # projection | columns_then_projection | craft
    min_line_height: 8
    smoothing: 3
    min_column_gap_ratio: 0.035    # used only by columns_then_projection
    min_column_width_ratio: 0.20   # reject narrow/noisy column partitions

  # Experimental word-gap chunking for CRNN lines wider than its short-line
  # operating range. Disabled unless explicitly enabled in an evaluation copy.
  long_line:
    enabled: false
    max_width: 512                 # recognizer-resized width, not source pixels
    min_gap_px: 3
    table_gap_ratio: 0.20
    max_chunks: 5                  # more cuts signal ambiguous/merged table rows

  backends:
    crnn_mozhi:
      weights: ./weights/recognize/crnn_mozhi_himr.pt
      charset: ./weights/recognize/charset_deva.txt
      img_height: 32
      max_width: 512
      inference_mode: legacy_cap   # legacy_cap | aspect_preserving (experimental)
      max_preserved_width: 8192    # wider crops log and raise; never silently squeeze
      beam_width: 10               # 1 = greedy CTC decode
      right_pad: 64                # trailing white columns per crop; chosen on validation
    trocr_printed:
      model_id: microsoft/trocr-base-printed
      max_new_tokens: 128
    bhashini_api:
      service_id: bhashini/iiith-bhasha-ocr
      endpoint_env: BHASHINI_ENDPOINT
      api_key_env: BHASHINI_API_KEY
      timeout_s: 30
      max_retries: 3
    paddle_vl:
      model_id: PaddlePaddle/PaddleOCR-VL
    surya:
      langs: [hi, mr, en]
      languages: [hi, mr, en]  # Surya 2 auto-detects these multilingual scripts
      server_url_env: SURYA_INFERENCE_URL
      allow_model_download: false  # requires an existing server unless explicitly enabled
    sarvam_document_ai:
      enabled: false             # experimental benchmark only; never selected by default
      api_key_env: SARVAM_API_KEY
      language: mr-IN            # Sarvam documents support Marathi; page inputs are Marathi-first
      output_format: json
      max_pages_per_job: 10      # conservative documented limit (some overview text says 30)
      price_inr_per_page: 0.50

# --------------------------------------------------------------- postprocessing
postprocess:
  unicode_normalize: NFC           # NFC is correct for Devanagari storage
  repair_shirorekha: true          # rejoin conjuncts split at the top bar
  strip_control_chars: true
  collapse_whitespace: true
  table_reconstruction: true
  table_method: tatr               # projection | tatr
  tatr_threshold: 0.3              # lower = catches more rows; 0.3 works well for govt docs
  tatr_min_height: 400             # upscale table crop to this height before TATR inference
  min_confidence: 0.0              # keep everything; filter at analysis time

# -------------------------------------------------------------------- output
output:
  formats: [json, markdown, text]  # json | markdown | text | pdf
  include_bbox: true
  include_confidence: true
  include_crops: false             # true dumps region images for debugging
  json_indent: 2

# ---------------------------------------------------------------- evaluation
eval:
  metrics: [cer, wer, layout_map, reading_order_acc, seconds_per_page]
  cer:
    normalize_unicode: true
    ignore_case: false             # meaningless for Devanagari; matters for English
    strip_punctuation: false
  systems:                         # what the comparison table gets populated with
    - tesseract_fullpage
    - paddle_vl_zeroshot
    - bhashini_api
    - surya
    - akshardrishti
